# ==========================================
# Streaming Website Nginx Location Blocks
# ==========================================
# These location blocks should be added to the server block for rydius.in on port 443
# (inside /etc/nginx/sites-available/default).

# 1. Serve static frontend files under https://rydius.in/streaming/
location /streaming {
    alias /var/www/streaming/;
    index index.html;
    # Revalidate instead of no-store: ETag/Last-Modified 304 responses keep repeat
    # visits near-instant (assets are additionally versioned with ?v= cache busters).
    add_header Cache-Control "no-cache, must-revalidate";
    # Compress JS/CSS/SVG on the wire (Ubuntu default gzip_types only covers HTML);
    # ~4x smaller transfers mean much faster player startup on slow viewer links.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    try_files $uri $uri/ /streaming/index.html =404;
}

# 2. Reverse proxy WebRTC signaling (WHEP/WHIP) to MediaMTX
location /stream-api/ {
    # Strip the '/stream-api/' prefix when forwarding to MediaMTX
    rewrite ^/stream-api/(.*)$ /$1 break;
    
    proxy_pass http://127.0.0.1:8889;
    
    # Handle Location headers correctly for WHEP resource sessions
    proxy_redirect / /stream-api/;
    
    # Standard proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # WebSocket support (if needed for telemetry or alternate paths)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";

    # Real-time WebRTC WHEP signaling zero-latency tuning
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
