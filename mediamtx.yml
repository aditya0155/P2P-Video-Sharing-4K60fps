###############################################
# MediaMTX configuration for the Windows laptop host.
# OBS publishes on loopback; WebRTC serves viewers over the Tailscale interface.
###############################################

# Logging
logLevel: info
logDestinations: [stdout]

# Metrics API
api: yes
apiAddress: 127.0.0.1:8888

# Outgoing packet queue per reader. The MediaMTX default is 512; 2048 doubles
# the officially recommended 1024 and is tuned for the receiver: a queue only
# holds packets when a viewer's link is briefly congested, so on a healthy link
# it is empty and adds nothing, while on a hotspot hiccup the backlog survives
# instead of overflowing (an overflowed queue is dropped or disconnects the
# reader — lost packets break decode until the next keyframe, which is exactly
# the "frame drops" this setup fights). The player's buffer accommodation
# absorbs the temporary added latency. 2048 packets x 1200 B = 2.46 MB of
# payload = ~0.41s at 6 Mbps (~0.42s on the wire at 1228 B including UDP and
# IPv4 headers), and ~2.4 MiB of RAM per reader when fully backlogged
# (20 viewers ~ 48 MiB). (An earlier version of this comment claimed 3.3s —
# 8x too high; 3.3s at 6 Mbps would need ~16,500 packets. The 2048 value is
# still sound: the measured worst 100ms window of this encode is ~104 packets,
# about 5% of the queue.)
writeQueueSize: 2048

# Maximum UDP payload MediaMTX packetizes for readers (v1.21.1 default: 1452).
#
# MEASURED — and this correction matters, because an earlier version of this
# file carried a long comment here claiming the 1452 default was fragmenting
# every packet sent to a remote viewer (this host's Tailscale adapter reports an
# MTU of 1280, and 1452 + 28 exceeds it). THAT CLAIM WAS FALSE.
#
# Measured A/B: a real 1280x720 H264 publish, a real MediaMTX, read by real
# headless Chrome through a genuine WHEP session. Mean inbound video RTP packet
# size, repeated across runs:
#
#     udpMaxPayloadSize: 200   -> 901.9 B
#     udpMaxPayloadSize: 1200  -> 901.1 B, 901.3 B, 901.3 B
#     udpMaxPayloadSize: 1452  -> 901.3 B, 902.1 B
#
# All indistinguishable — even an absurd 200-byte cap. The WebRTC path does not
# read this key at all: it packetizes with its own ~1200-byte MTU, which puts
# packets at ~901 B mean and comfortably inside a 1280-byte MTU (1200 + 28 on
# the wire). So there was never IP fragmentation on the WebRTC path, and this
# line was never a fragmentation fix.
#
# It is kept because the key does exist and is honoured by MediaMTX's other RTP
# consumers, where 1200 is still the correct value on this host — 1452 + 20
# (IPv4) + 8 (UDP) = 1480 would exceed the tunnel MTU. Just do not expect it to
# change anything a WebRTC viewer receives.
udpMaxPayloadSize: 1200

# Enlarge per-socket UDP receive buffers so publisher bursts and viewer RTCP
# feedback (NACK / transport-cc) are not dropped by the OS when the WebRTC or
# SRT sockets get a burst of packets. MediaMTX recommends raising this to
# decrease packet loss; 0 would keep the small OS default.
udpReadBufferSize: 1048576

# Publisher timeouts. These default to 10s and were written out as if they were
# decisions. They are INERT for WebRTC readers (a reader is a pion
# PeerConnection, not a byte stream with read deadlines) — they bound the
# PUBLISHERS, and they are the only thing standing between a host hiccup and a
# broadcast-wide disconnect. The RTMP publisher is on LOOPBACK, so 10s of
# silence there cannot be blamed on the network: it means the publisher process
# itself stopped running (NVENC contention, a Windows Defender scan, a driver
# stall — this box runs OBS + the bridge's NVENC/NVDEC + MediaMTX + Node at
# once). At 10s that flips `live` to not-ready and hard-disconnects EVERY viewer
# for a 2-4s re-WHEP, which is a room-wide freeze, not a per-viewer stutter.
# 20s buys host-stall immunity; a genuinely crashed publisher still exits
# immediately on EOF, so nothing is retained.
readTimeout: 20s
writeTimeout: 20s

###############################################
# Ingest Protocols (OBS Studio)
###############################################

# RTSP exists only so codec_bridge.js can read the source back (RTMP cannot
# serve AV1; RTSP can). Bound to loopback: nothing outside this laptop uses it.
rtsp: yes
rtspAddress: 127.0.0.1:8554
hls: no
moq: no

# RTMP Ingest from local OBS Studio: rtmp://127.0.0.1/live
rtmp: yes
rtmpAddress: 127.0.0.1:1935

# Optional SRT ingest from OBS on this laptop only.
srt: yes
srtAddress: 127.0.0.1:8890

###############################################
# Egress Protocols (WebRTC WHEP to Viewers)
###############################################

# WebRTC signaling HTTP server (reverse proxied by server.js to port 3000)
webrtc: yes
webrtcAddress: 127.0.0.1:8889

# Maximum time to gather STUN candidates. MediaMTX's default is 5s, and this
# budget is NESTED inside webrtcHandshakeTimeout (10s) alongside the 2s track
# gather: 5 + 2 = 7 of the 10 seconds can be spent before MediaMTX writes a
# single byte of the SDP answer — while the player aborts its own WHEP POST at
# 10s (app.js). A single UDP binding request to stun.cloudflare.com costs
# 20-80ms on a healthy uplink, so 2s is ~25x the real cost. The failure mode
# this removes is not stutter, it is permanent remote-viewing failure: when the
# STUN binding times out, the answer comes back with NO srflx candidate, and
# the only candidates left are host addresses (the hotspot LAN 192.168.x.x and
# Tailscale 100.x) which are unreachable from the internet. The handshake
# succeeds, ICE never connects, and the client watchdog rejoins forever. This
# host's uplink is a phone hotspot already saturated carrying the video —
# exactly the condition under which a STUN binding is slow. Failing FAST means
# a diagnosable missing-candidate instead of a 5s penalty on every connect.
webrtcSTUNGatherTimeout: 2s

# WebRTC media UDP port (RTP packets)
webrtcLocalUDPAddress: 0.0.0.0:8189
# ICE-TCP is deliberately OFF. MediaMTX ships it disabled ("TCP is less
# efficient than UDP and introduces a progressive delay when network is
# congested"), and this project's media is DTLS-SRTP, so a negotiated TCP
# candidate inherits head-of-line blocking: one lost segment stalls all
# subsequent video until RTO expiry, turning a ~20ms UDP jitter blip on a lossy
# hotspot into a 200-600ms hard freeze. Muxing it on the same port as UDP also
# means a viewer on a UDP-restricting network (hotel/corporate Wi-Fi, a CGNAT
# that throttles UDP) can win nomination onto that worse path with nothing in
# the UI to say so. If a viewer genuinely cannot do UDP, give them TURN
# (secrets.local.env -> /stream-api/turn) instead: TURN/UDP is not head-of-line
# blocked. Re-enable this on a SEPARATE port if it is ever needed, never
# multiplexed onto 8189 where it competes with the healthy path.
webrtcLocalTCPAddress: ""

# Automatically query local network adapters (LAN, Wi-Fi, Tailscale VPN)
webrtcIPsFromInterfaces: yes

# WHIP ingest is available on /live/whip while WebRTC is enabled.
webrtcHandshakeTimeout: 10s

# ICE servers: Cloudflare's public STUN only (no account, no credentials, no
# card). It gives MediaMTX a server-reflexive (public) candidate so remote
# viewers can hole-punch a direct path instead of needing a TURN relay. A real
# binding request to stun.cloudflare.com:3478 was verified answered from this
# hotspot with a public mapped address. Google STUN was historically
# unreachable from this network and stays out. TURN relay remains optional and
# is served to VIEWERS by server.js (/stream-api/turn) when CF_TURN_KEY_* is
# configured — nothing to change here for that.
webrtcICEServers2:
  - url: stun:stun.cloudflare.com:3478

###############################################
# Stream Paths
###############################################
paths:
  # Primary path: whatever OBS publishes (H.264 or AV1).
  live:
    # Instant publisher reconnect when OBS starts/stops
    overridePublisher: yes
    # GPU companion rendition: codec_bridge.js watches this path and publishes
    # the *other* codec (AV1 source -> live-h264 fallback, H264 source ->
    # live-av1 low-bitrate rendition) with NVENC on the RTX 4070.
    # runOnUnavailable kills any leftover ffmpeg (see PID guard in the script).
    runOnAvailable: node "codec_bridge.js"
    runOnAvailableRestart: true
    runOnUnavailable: node "codec_bridge.js" --cleanup
    publishUser:
    publishPass:
    readUser:
    readPass:
  # Auto-created rendition paths (published by codec_bridge.js only).
  live-av1:
    overridePublisher: yes
  live-h264:
    overridePublisher: yes
